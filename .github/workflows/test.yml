name: CANLab tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 iproute2 kmod

      - name: Build and run protocol tests
        run: python3 build.py

      - name: Install and enable virtual CAN
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo modprobe vcan; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo depmod -a
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip -details link show vcan0

      - name: Run live CAN integration tests
        run: python3 tests/test_vcan.py vcan0