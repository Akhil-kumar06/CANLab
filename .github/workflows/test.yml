name: CANLab tests
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and protocol checks
        run: python3 build.py
      - name: Configure virtual CAN
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      - name: Live CAN tests
        run: python3 tests/test_vcan.py vcan0
